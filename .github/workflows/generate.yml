name: Test generate drop image

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install rust
      run: |
        rustup toolchain install nightly --profile minimal
        rustup default nightly

    - name: Build sumi
      run: |
        if [ -f "sumi/Cargo.toml" ]; then
          cargo +nightly build --release --manifest-path sumi/Cargo.toml
        else
          cargo +nightly build --release
        fi

    - name: Start sumi server
      env:
        PORT: 3000
        RUST_LOG: debug
        RUST_BACKTRACE: 1
      run: |
        # Locate cards directory (either sumi/assets or assets)
        if [ -d "sumi/assets" ]; then
          export CARDS_DIR="$(pwd)/sumi/assets"
        else
          export CARDS_DIR="$(pwd)/assets"
        fi
        echo "Using CARDS_DIR: $CARDS_DIR"

        # Locate compiled binary
        if [ -f "./target/release/sumi" ]; then
          SUMI_BIN="./target/release/sumi"
        elif [ -f "./sumi/target/release/sumi" ]; then
          SUMI_BIN="./sumi/target/release/sumi"
        else
          SUMI_BIN=$(find . -type f -name "sumi" -path "*/release/*" | head -n 1)
        fi
        echo "Using binary: $SUMI_BIN"

        $SUMI_BIN > sumi.log 2>&1 &
        echo $! > sumi.pid

        # Wait for sumi to be healthy (checks both /metrics and /health)
        echo "Waiting for sumi to start..."
        for i in {1..30}; do
          if curl -s -f http://127.0.0.1:3000/metrics > /dev/null 2>&1 || curl -s -f http://127.0.0.1:3000/health > /dev/null 2>&1 || curl -s http://127.0.0.1:3000/ > /dev/null 2>&1; then
            echo "sumi is ready and listening on port 3000!"
            break
          fi
          if ! kill -0 $(cat sumi.pid) 2>/dev/null; then
            echo "Error: sumi process exited prematurely. Showing sumi.log:"
            cat sumi.log
            exit 1
          fi
          sleep 1
        done

    - name: Request random drop
      run: |
        mkdir -p generated
        
        # Locate cards directory
        if [ -d "sumi/assets" ]; then
          SEARCH_DIR="sumi/assets"
        else
          SEARCH_DIR="assets"
        fi

        # Find all .webp cards in assets folder
        CARDS=()
        while IFS= read -r f; do
          if [ -n "$f" ]; then
            card_name=$(basename "$f" .webp)
            CARDS+=("$card_name")
          fi
        done < <(find "$SEARCH_DIR" -type f -name "*.webp")
        
        if [ ${#CARDS[@]} -eq 0 ]; then
          echo "Error: No cards (.webp) found in '$SEARCH_DIR'."
          echo "Directory contents of $SEARCH_DIR:"
          ls -la "$SEARCH_DIR" || ls -la
          exit 1
        fi
        
        echo "Found cards: ${CARDS[*]}"
        
        # Pick 2 random cards and print numbers
        CARD1=${CARDS[$((RANDOM % ${#CARDS[@]}))]}
        CARD2=${CARDS[$((RANDOM % ${#CARDS[@]}))]}
        PRINT1=$((1 + RANDOM % 99))
        PRINT2=$((1 + RANDOM % 99))
        FILENAME="drop_$(date +%s).webp"
        
        echo "Rendering drop: left=$CARD1 (#$PRINT1), right=$CARD2 (#$PRINT2)"
        
        # Perform render request with status code check
        HTTP_CODE=$(curl -s -w "%{http_code}" -o "generated/$FILENAME" "http://localhost:3000/render/drop?left=$CARD1&right=$CARD2&left_print=$PRINT1&right_print=$PRINT2")
        
        if [ "$HTTP_CODE" != "200" ]; then
          echo "Error: Render request failed with HTTP $HTTP_CODE"
          echo "Server response:"
          cat "generated/$FILENAME"
          echo ""
          echo "=== sumi.log ==="
          cat sumi.log
          exit 1
        fi
        
        echo "Success: Image rendered and saved to generated/$FILENAME ($(wc -c < "generated/$FILENAME") bytes)"

    - name: Stop sumi server
      if: always()
      run: |
        if [ -f sumi.pid ]; then
          kill $(cat sumi.pid) 2>/dev/null || true
        fi
        echo "=== Full sumi.log ==="
        cat sumi.log || true

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: drop-artifacts
        path: |
          generated/*.webp
          sumi.log
        if-no-files-found: ignore

    - name: Commit and push image to repo
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: test generated drop image"
        file_pattern: 'generated/*.webp'
        commit_user_name: "github-actions[bot]"
        commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
        
