name: Test generate drop image

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install rust
      run: rustup toolchain install nightly

    - name: Build sumi
      run: cargo +nightly build --release

    - name: Start sumi server
      env:
        CARDS_DIR: "assets"
        PORT: 3000
        RUST_LOG: info
      run: |
        ./target/release/sumi > sumi.log 2>&1 &
        echo $! > sumi.pid
        
        # Wait up to 30 seconds for sumi to become healthy
        echo "Waiting for sumi to start..."
        for i in {1..30}; do
          if curl -s http://127.0.0.1:3000/health > /dev/null; then
            echo "sumi is ready and listening on port 3000!"
            break
          fi
          if ! kill -0 $(cat sumi.pid) 2>/dev/null; then
            echo "Error: sumi process exited prematurely. Showing sumi.log:"
            cat sumi.log
            exit 1
          fi
          sleep 1
        done

    - name: Request random drop
      run: |
        mkdir -p generated
        CARDS=($(find assets -type f \( -name "*.webp" \) | sed 's|assets/||' | sed 's|\.webp||' | sed 's|\.png||'))
        
        if [ ${#CARDS[@]} -eq 0 ]; then
          echo "Error: No cards (.webp) found in the assets folder."
          exit 1
        fi
        
        CARD1=${CARDS[$((RANDOM % ${#CARDS[@]}))]}
        CARD2=${CARDS[$((RANDOM % ${#CARDS[@]}))]}
        PRINT1=$((1 + RANDOM % 9))
        PRINT2=$((1 + RANDOM % 9))
        FILENAME="drop_$(date +%s).webp"
        
        curl -s -f -o "generated/$FILENAME" "http://localhost:3000/render/drop?left=$CARD1&right=$CARD2&left_print=$PRINT1&right_print=$PRINT2"
        
        echo "image rendered and saved to generated/$FILENAME"

    - name: Stop sumi server
      if: always()
      run: |
        if [ -f sumi.pid ]; then
          kill $(cat sumi.pid) || true
        fi
        if [ -f sumi.log ]; then
          echo "=== sumi.log output ==="
          cat sumi.log
        fi

    - name: Commit and push image to repo
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: test generated drop image"
        file_pattern: 'generated/*.webp'
