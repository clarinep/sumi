name: benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  render-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always
      HOST: 127.0.0.1
      PORT: 8888
      CARDS_DIR: ${{ github.workspace }}/assets
      BENCH_LEFT: card_name_here
      BENCH_RIGHT: card_name_here

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install bench tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Build release
        run: cargo build --release

      - name: Start sumi
        shell: bash
        run: |
          ./target/release/sumi > ./sumi.log 2>&1 &
          echo $! > ./sumi.pid
          for i in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:8888/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

      - name: Bench 4/4 for 10s
        shell: bash
        run: |
          URL="http://127.0.0.1:8888/render/drop?left=${BENCH_LEFT}&right=${BENCH_RIGHT}&left_print=1&right_print=1"
          echo "== 4 threads / 4 conns / 10s =="
          wrk -t4 -c4 -d10s --timeout 5s "$URL"

      - name: Bench 4/100 for 30s
        shell: bash
        run: |
          URL="http://127.0.0.1:8888/render/drop?left=${BENCH_LEFT}&right=${BENCH_RIGHT}&left_print=1&right_print=1"
          echo "== 4 threads / 100 conns / 30s =="
          wrk -t4 -c100 -d30s --timeout 5s "$URL"

      - name: Stop sumi
        if: always()
        shell: bash
        run: |
          if [ -f ./sumi.pid ]; then
            kill "$(cat ./sumi.pid)" || true
          fi
