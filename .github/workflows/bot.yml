name: run-bot-test

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Show Runner Specifications
        run: |
          echo "=== CPU SPECIFICATIONS ==="
          lscpu
          echo ""
          echo "=== MEMORY (RAM) SPECIFICATIONS ==="
          free -h
          echo ""
          echo "=== DISK SPACE ==="
          df -h /
          echo ""
          echo "=== OS VERSION ==="
          cat /etc/os-release

      - name: checkout repository
        uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2

      - name: run bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CARDS_DIR: assets
          RUST_LOG: info
        run: |
          cargo run --release --bin bot
