name: Check Unused Features

on:
  workflow_dispatch: # Allows triggering this manually

jobs:
  check-features:
    name: Find Unused Cargo Features
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-unused-features
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-unused-features

      - name: Run cargo-unused-features
        run: cargo unused-features analyze
